name: Daily Evolutionary Sandbox

on:
  schedule:
    # Run every night at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual execution via the GitHub Actions tab

permissions:
  contents: write

jobs:
  evolve:
    runs-on: ubuntu-latest

    steps:
    - name: Configure Git SSL verification
      run: git config --global http.sslVerify false

    - name: Checkout repository
      uses: actions/checkout@v4
      env:
        GIT_SSL_NO_VERIFY: "true"
      with:
        fetch-depth: 0

    - name: Checkout World C
      uses: actions/checkout@v4
      with:
        repository: 'nini1972/world_c'
        path: 'world_c'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        if [ -f world_c/requirements.txt ]; then
          pip install -r world_c/requirements.txt
        fi

    - name: Sync Embassy (pull ratified treaties from Synthetic Agora)
      run: |
        python embassy_bridge.py

    - name: Pre-warm Sovereign Runpod vLLM Worker
      continue-on-error: true
      env:
        RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      run: |
        python -c "
        import os, urllib.request, json
        api_key = os.getenv('RUNPOD_API_KEY')
        endpoint_id = 'nxrwj2zma759vc'
        if api_key:
            print('[Pre-warm] Waking up sovereign InvariantMind worker on Runpod in background...')
            url = f'https://api.runpod.ai/v2/{endpoint_id}/run'
            payload = json.dumps({'input': {'model': 'Ninitje/InvariantMind-Worker-7B-Merged', 'messages': [{'role': 'user', 'content': 'warmup'}], 'max_tokens': 1}}).encode('utf-8')
            req = urllib.request.Request(url, data=payload, headers={'Authorization': f'Bearer {api_key}', 'Content-Type': 'application/json'})
            try:
                with urllib.request.urlopen(req, timeout=10) as resp:
                    print(f'[Pre-warm] Queued async warmup job: status {resp.status}')
            except Exception as e:
                print(f'[Pre-warm] Note: {e}')
        else:
            print('[Pre-warm] No RUNPOD_API_KEY configured, skipping warmup.')
        "

    - name: Run parallel evolution loop
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        PYTHONUNBUFFERED: "1"
      run: |
        # Calculate if today is a 20-tick deep-run day (every 3rd day)
        EPOCH_DAYS=$(( $(date +%s) / 86400 ))
        if [ $(( EPOCH_DAYS % 3 )) -eq 0 ]; then
          TICKS=20
          echo "Deep-run day! Running 20 ticks."
        else
          TICKS=8
          echo "Daily pulse day. Running 8 ticks."
        fi
        
        python run_parallel.py --instances gemini_pro,claude_sonnet_4_5,llama_3_3,claude_haiku,gemini_3_1_flash_lite,llama_4_scout,kimi_code,minimax_m3,deepseek_v4_flash,glm_5_2,glm_4_7_flash,tencent_hy3,xiaomi_mimo,nex_n2_pro,poolside_laguna,invariant_mind --ticks $TICKS

    - name: Run collaborative multi-agent expedition
      continue-on-error: true
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        PYTHONUNBUFFERED: "1"
      run: |
        # Calculate if today is a deep-run day (every 3rd day)
        EPOCH_DAYS=$(( $(date +%s) / 86400 ))
        if [ $(( EPOCH_DAYS % 3 )) -eq 0 ]; then
          ROUNDS=6
          echo "Deep-run day! Launching collaborative expedition with 6 rounds (12 turns)..."
        else
          ROUNDS=4
          echo "Daily pulse day. Launching collaborative expedition with 4 rounds (8 turns)..."
        fi
        python collaborative_expedition.py --auto --rounds $ROUNDS

    - name: Execute World C Compute Queue
      continue-on-error: true
      run: |
        python -c "
        import sys, os
        world_c_path = os.path.abspath('world_c')
        if os.path.exists(world_c_path):
            sys.path.insert(0, world_c_path)
            from embassy.bridge import EmbassyBridge
            bridge = EmbassyBridge(world_a_root=os.path.abspath('.'), world_c_root=world_c_path)
            results = bridge.scan_and_process_inbox(auto_execute=True, async_mode=False)
            reconciled = bridge.reconcile_active_jobs(timeout=60.0)
            print(f'[CI] World C executed {len(results)} pending jobs, reconciled {len(reconciled)} async jobs successfully.')
        else:
            print('[CI] World C path not found, skipping compute queue execution.')
        "

    - name: Compile Living Evolution Dashboard
      run: |
        python compile_dashboard.py

    - name: Commit and push updates
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Remove any unexpected large downloaded archives/datasets (>50MB) before staging
        find instances/ -type f -size +50M -delete 2>/dev/null || true
        
        # Remove any nested .git folders created by agents to prevent invalid submodules (gitlinks)
        find instances/ -mindepth 2 -name ".git" -type d -prune -exec rm -rf {} + 2>/dev/null || true
        
        # Remove any Windows-incompatible reserved files (e.g. 'nul' from 2>nul redirections)
        find instances/ -name "nul" -delete 2>/dev/null || true
        find instances/ -name "NUL" -delete 2>/dev/null || true
        rm -f nul NUL 2>/dev/null || true
        
        # Add all workspace, log, and living dashboard changes
        git add instances/ dashboard.html
        
        # Only commit and push if there are changes
        if ! git diff --cached --quiet; then
          git commit -m "chore: nightly evolution step - $(date +'%Y-%m-%d %H:%M:%S')"
          git pull --rebase origin main
          git push origin main
        else
          echo "No changes in workspaces or logs to commit."
        fi

