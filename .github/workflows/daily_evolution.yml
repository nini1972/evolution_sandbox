name: Daily Evolutionary Sandbox

on:
  schedule:
    # Run every night at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual execution via the GitHub Actions tab

permissions:
  contents: write

jobs:
  evolve:
    runs-on: ubuntu-latest

    steps:
    - name: Configure Git SSL verification
      run: git config --global http.sslVerify false

    - name: Checkout repository
      uses: actions/checkout@v4
      env:
        GIT_SSL_NO_VERIFY: "true"
      with:
        fetch-depth: 0

    - name: Checkout World C
      uses: actions/checkout@v4
      with:
        repository: 'nini1972/world_c'
        path: 'world_c'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        if [ -f world_c/requirements.txt ]; then
          pip install -r world_c/requirements.txt
        fi

    - name: Sync Embassy (pull ratified treaties from Synthetic Agora)
      run: |
        python embassy_bridge.py

    - name: Runpod Endpoint Maintenance and Health Check
      continue-on-error: true
      env:
        RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      run: |
        python -c "
        import os, urllib.request, json, time
        api_key = os.getenv('RUNPOD_API_KEY')
        endpoint_id = 'nxrwj2zma759vc'
        if api_key:
            headers = {'Authorization': f'Bearer {api_key}', 'Content-Type': 'application/json', 'User-Agent': 'curl/8.0'}
            # 1. Purge any stale queued jobs to keep endpoint clean
            purge_url = f'https://api.runpod.ai/v2/{endpoint_id}/purge-queue'
            req_p = urllib.request.Request(purge_url, data=b'{}', headers=headers, method='POST')
            removed_jobs = 0
            try:
                with urllib.request.urlopen(req_p, timeout=10) as resp:
                    p_body = resp.read().decode()
                    print(f'[RunPod Maintenance] Purged queue: {p_body}')
                    p_data = json.loads(p_body)
                    removed_jobs = int(p_data.get('removed', 0))
            except Exception as e:
                print(f'[RunPod Maintenance] Purge error: {e}')

            # 2. Check worker health and inspect individual workers via RunPod REST API v2
            health_url = f'https://api.runpod.ai/v2/{endpoint_id}/health'
            req_h = urllib.request.Request(health_url, headers=headers)
            try:
                with urllib.request.urlopen(req_h, timeout=10) as resp:
                    h_body = resp.read().decode()
                    print(f'[RunPod Maintenance] Endpoint health: {h_body}')
                    h_data = json.loads(h_body)
                    workers = h_data.get('workers', {})
                    unhealthy = int(workers.get('unhealthy', 0))
                    initializing = int(workers.get('initializing', 0))
                    idle = int(workers.get('idle', 0))

                    # Also check REST API v2 workers list for any unhealthy/wedged workers
                    v2_workers_url = f'https://api.runpod.io/v2/serverless/{endpoint_id}/workers'
                    req_w = urllib.request.Request(v2_workers_url, headers=headers)
                    with urllib.request.urlopen(req_w, timeout=10) as resp_w:
                        w_list = json.loads(resp_w.read().decode())
                        print(f'[RunPod Maintenance] REST v2 workers ({len(w_list)}): {[w.get(\"desiredStatus\") for w in w_list]}')

                    if unhealthy > 0 or (removed_jobs > 0 and initializing > 0 and idle == 0):
                        print(f'[RunPod Maintenance] Detected wedged worker (unhealthy={unhealthy}, initializing={initializing}, removed_jobs={removed_jobs}). Recycling worker via RunPod REST API v2...')
                        v2_ep_url = f'https://api.runpod.io/v2/serverless/{endpoint_id}'
                        req_down = urllib.request.Request(v2_ep_url, data=json.dumps({'workers': {'min': 0, 'max': 0, 'idleTimeout': 720}}).encode(), headers=headers, method='PATCH')
                        urllib.request.urlopen(req_down, timeout=10).read()
                        time.sleep(3)
                        req_up = urllib.request.Request(v2_ep_url, data=json.dumps({'workers': {'min': 0, 'max': 1, 'idleTimeout': 720}}).encode(), headers=headers, method='PATCH')
                        urllib.request.urlopen(req_up, timeout=10).read()
                        print('[RunPod Maintenance] Worker recycled cleanly via RunPod REST API v2 (workersMax 0 -> 1).')
            except Exception as e:
                print(f'[RunPod Maintenance] Health/worker check error: {e}')
        else:
            print('[RunPod Maintenance] No RUNPOD_API_KEY configured, skipping check.')
        "

    - name: Run parallel evolution loop
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        PYTHONUNBUFFERED: "1"
        PYTHONPATH: "${{ github.workspace }}/world_c"
      run: |
        # Calculate if today is a 20-tick deep-run day (every 3rd day)
        EPOCH_DAYS=$(( $(date +%s) / 86400 ))
        if [ $(( EPOCH_DAYS % 3 )) -eq 0 ]; then
          TICKS=20
          echo "Deep-run day! Running 20 ticks."
        else
          TICKS=8
          echo "Daily pulse day. Running 8 ticks."
        fi
        
        python run_parallel.py --instances gemini_pro,claude_sonnet_4_5,llama_3_3,claude_haiku,gemini_3_1_flash_lite,llama_4_scout,kimi_code,minimax_m3,deepseek_v4_flash,glm_5_2,glm_4_7_flash,tencent_hy3,xiaomi_mimo,nex_n2_pro,poolside_laguna,invariant_mind --ticks $TICKS

    - name: Run collaborative multi-agent expedition
      continue-on-error: true
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        PYTHONUNBUFFERED: "1"
        PYTHONPATH: "${{ github.workspace }}/world_c"
      run: |
        # Calculate if today is a deep-run day (every 3rd day)
        EPOCH_DAYS=$(( $(date +%s) / 86400 ))
        if [ $(( EPOCH_DAYS % 3 )) -eq 0 ]; then
          ROUNDS=12
          echo "Deep-run day! Launching collaborative expedition with 12 rounds (24 turns)..."
        else
          ROUNDS=8
          echo "Daily pulse day. Launching collaborative expedition with 8 rounds (16 turns)..."
        fi
        python collaborative_expedition.py --auto --rounds $ROUNDS

    - name: Execute World C Compute Queue
      if: always()
      continue-on-error: true
      run: |
        python -c "
        import sys, os
        world_c_path = os.path.abspath('world_c')
        if os.path.exists(world_c_path):
            sys.path.insert(0, world_c_path)
            from embassy.bridge import EmbassyBridge
            bridge = EmbassyBridge(world_a_root=os.path.abspath('.'), world_c_root=world_c_path)
            results = bridge.scan_and_process_inbox(auto_execute=True, async_mode=False)
            reconciled = bridge.reconcile_active_jobs(timeout=300.0)
            print(f'[CI] World C executed {len(results)} pending jobs, reconciled {len(reconciled)} async jobs successfully.')
        else:
            print('[CI] World C path not found, skipping compute queue execution.')
        "

    - name: Compile Living Evolution Dashboard
      if: always()
      run: |
        python compile_dashboard.py

    - name: Commit and push updates
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Remove any unexpected large downloaded archives/datasets (>50MB) before staging
        find instances/ -type f -size +50M -delete 2>/dev/null || true
        
        # Remove any nested .git folders created by agents to prevent invalid submodules (gitlinks)
        find instances/ -mindepth 2 -name ".git" -type d -prune -exec rm -rf {} + 2>/dev/null || true
        
        # Remove any Windows-incompatible reserved files or wildcard characters in paths (e.g. 'nul', '*', '?', ':')
        find instances/ -name "nul" -delete 2>/dev/null || true
        find instances/ -name "NUL" -delete 2>/dev/null || true
        find instances/ -depth -name '*[\*\?\:\<\>\|]*' -exec rm -rf {} + 2>/dev/null || true
        rm -f nul NUL 2>/dev/null || true
        
        # Add all workspace, log, and living dashboard changes
        git add instances/ dashboard.html
        
        # Only commit and push if there are changes
        if ! git diff --cached --quiet; then
          git commit -m "chore: nightly evolution step - $(date +'%Y-%m-%d %H:%M:%S')"
          git pull --rebase origin main
          git push origin main
        else
          echo "No changes in workspaces or logs to commit."
        fi

